        color: #e0e2ea;
      }
      .glass-panel {
        background: rgba(22, 27, 34, 0.7);

        border: 1px solid #30363d;
      }
      .input-glow:focus-within, .input-glass:focus {
        border-color: #58a6ff;
        box-shadow: 0 0 0 2px rgba(88, 166, 255, 0.3);

      }
      .btn-primary {
        background-color: #238636;
        color: #f0f6fc;
        transition: background-color 0.2s ease;
      }
      .btn-primary:hover {

      }
      .ambient-bg {
